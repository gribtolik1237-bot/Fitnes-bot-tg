<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Твой Тренер — Pro Fitness</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #07080c;
    --surface: #10131c;
    --surface-2: #171c28;
    --surface-3: #202738;
    --border: rgba(255, 255, 255, 0.08);
    --lime: #a3e635;
    --emerald: #10b981;
    --cyan: #38bdf8;
    --amber: #fbbf24;
    --danger: #f43f5e;
    --text: #f8fafc;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0 0 calc(98px + env(safe-area-inset-bottom)) 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(7, 8, 12, 0.88);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo-box {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--lime), var(--emerald));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px; color: #07080c; letter-spacing: -0.5px;
    box-shadow: 0 4px 20px rgba(163, 230, 53, 0.28);
  }
  .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }
  .brand-sub { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .timer-chip {
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 7px 13px; border-radius: 999px; flex-shrink: 0;
    font-size: 12px; font-weight: 800; color: var(--lime);
    display: flex; align-items: center; gap: 5px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .timer-chip.running {
    background: rgba(244, 63, 94, 0.18); border-color: rgba(244, 63, 94, 0.55); color: #fda4af;
  }

  .progress-wrap {
    margin-top: 10px; display: flex; align-items: center; gap: 10px;
  }
  .progress-track {
    flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--emerald), var(--lime));
    border-radius: 99px; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-txt { font-size: 11px; font-weight: 800; color: var(--text-dim); }

  .container { padding: 14px 16px; max-width: 560px; margin: 0 auto; }

  /* LOADER */
  .loader-box {
    text-align: center; padding: 48px 20px; color: var(--text-dim); font-size: 14px; font-weight: 600;
  }
  .spinner {
    width: 34px; height: 34px; border: 3px solid var(--surface-3);
    border-top-color: var(--lime); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 14px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* WEEK STRIP */
  .week-strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
    margin-bottom: 12px;
  }
  .day-dot {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 2px; text-align: center;
    font-size: 11px; font-weight: 800; color: var(--text-dim);
  }
  .day-dot.scheduled {
    border-color: rgba(163, 230, 53, 0.35); color: #d9f99d;
  }
  .day-dot.today {
    background: linear-gradient(135deg, rgba(163, 230, 53, 0.22), rgba(16, 185, 129, 0.18));
    border-color: var(--lime); color: var(--lime);
  }

  /* SEGMENT CONTROL */
  .segment {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--surface); padding: 5px; border-radius: 15px;
    border: 1px solid var(--border); margin-bottom: 14px;
  }
  .seg-btn {
    border: none; background: transparent; color: var(--text-dim);
    padding: 10px; border-radius: 11px; font-size: 13px; font-weight: 800;
    cursor: pointer; transition: all 0.15s ease;
  }
  .seg-btn.active {
    background: var(--surface-3); color: var(--lime);
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }

  /* HERO BANNER */
  .hero-card {
    background: linear-gradient(155deg, #151a27 0%, #0d1017 100%);
    border: 1px solid var(--border); border-radius: 22px;
    padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden;
  }
  .hero-top-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--lime); background: rgba(163, 230, 53, 0.12);
    padding: 4px 10px; border-radius: 7px;
  }
  .tonnage-pill {
    font-size: 11px; font-weight: 800; color: var(--cyan);
    background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 4px 9px; border-radius: 7px;
  }
  .hero-title { font-size: 18px; font-weight: 800; line-height: 1.25; margin-bottom: 5px; }
  .hero-sub { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
  .hero-quote {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 12px; color: #cbd5e1; font-style: italic; line-height: 1.4;
  }

  /* WARMUP ACCORDION */
  .warmup-card {
    background: var(--surface); border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 18px; padding: 12px 14px; margin-bottom: 16px;
  }
  .warmup-hdr {
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    font-size: 13px; font-weight: 800; color: var(--cyan);
  }
  .warmup-list {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .warm-item {
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cbd5e1;
    background: var(--surface-2); padding: 8px 10px; border-radius: 10px; cursor: pointer;
  }
  .warm-item.checked { opacity: 0.55; text-decoration: line-through; }

  /* EXERCISE CARD */
  .ex-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px; margin-bottom: 18px; overflow: hidden;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42);
    transition: border-color 0.25s ease;
  }
  .ex-card.done { border-color: rgba(16, 185, 129, 0.55); }

  /* BIOMECHANICS STAGE */
  .demo-stage {
    width: 100%; height: 156px; cursor: pointer;
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(circle at 50% 45%, #1b2436 0%, #0b0e15 100%);
    background-size: 24px 24px, 24px 24px, 100% 100%;
    border-bottom: 1px solid var(--border);
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .demo-stage svg { width: 100%; height: 100%; max-width: 340px; }
  .demo-badge-tl {
    position: absolute; top: 10px; left: 12px;
    display: flex; gap: 6px; flex-wrap: wrap; z-index: 2;
  }
  .pill {
    font-size: 10px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 4px 9px; border-radius: 8px;
    background: rgba(7, 8, 12, 0.8); backdrop-filter: blur(8px);
    border: 1px solid var(--border); color: #e2e8f0;
  }
  .pill-prio { color: var(--lime); border-color: rgba(163, 230, 53, 0.45); }
  .pill-done { background: rgba(16, 185, 129, 0.28); color: #6ee7b7; border-color: #10b981; }
  .demo-legend {
    position: absolute; bottom: 8px; right: 12px;
    font-size: 10px; font-weight: 700; color: var(--text-dim);
    background: rgba(7, 8, 12, 0.75); padding: 3px 8px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .ex-body { padding: 16px; }
  .ex-title { font-size: 16px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }

  .meta-strip {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
  }
  .meta-item {
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 9px; font-size: 11px; color: #cbd5e1; font-weight: 600;
  }
  .meta-item b { color: var(--text); }
  .meta-rest { color: var(--cyan); cursor: pointer; border-color: rgba(56, 189, 248, 0.28); }
  .meta-plates { color: var(--amber); cursor: pointer; border-color: rgba(251, 191, 36, 0.28); }

  .cue-box {
    background: rgba(255, 255, 255, 0.03);
    border-left: 3px solid var(--lime);
    padding: 10px 12px; border-radius: 0 11px 11px 0;
    font-size: 12px; line-height: 1.45; color: var(--text-dim);
    margin-bottom: 14px;
  }

  /* TACTILE SET LOGGING */
  .tracker-box {
    background: #0a0c12; border: 1px solid var(--border);
    border-radius: 16px; padding: 12px;
  }
  .weight-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-2); padding: 8px 12px; border-radius: 12px;
    margin-bottom: 11px; border: 1px solid var(--border);
  }
  .weight-label { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .step-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-3); color: var(--text); font-size: 17px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .step-btn:active { transform: scale(0.92); background: var(--lime); color: #07080c; }
  .weight-input {
    width: 64px; text-align: center; background: transparent; border: none;
    color: var(--lime); font-size: 16px; font-weight: 900;
  }

  .sets-label {
    font-size: 11px; font-weight: 700; color: var(--text-dim);
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .batch-btns { display: flex; gap: 5px; }
  .mini-pill-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--lime);
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; cursor: pointer;
  }
  .mini-pill-btn:active { background: var(--lime); color: #07080c; }

  .sets-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 7px; margin-bottom: 12px;
  }
  .set-pill {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 7px 4px; text-align: center;
  }
  .set-pill:focus-within { border-color: var(--lime); background: var(--surface-3); }
  .set-num { font-size: 9px; text-transform: uppercase; color: var(--text-dim); font-weight: 800; margin-bottom: 3px; }
  .set-val-input {
    width: 100%; background: transparent; border: none; text-align: center;
    color: var(--text); font-size: 15px; font-weight: 800; padding: 0;
  }

  .btn-row { display: flex; gap: 8px; }
  .btn {
    border: none; border-radius: 13px; padding: 12px 13px;
    font-size: 13px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-lime {
    background: linear-gradient(135deg, var(--lime), var(--emerald));
    color: #07080c; border: none;
    box-shadow: 0 4px 18px rgba(163, 230, 53, 0.25);
  }
  .btn-danger { background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.4); color: #fda4af; }
  .btn-full { width: 100%; padding: 15px; font-size: 14px; }

  /* TIMER RING */
  .ring-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px 0 18px 0; position: relative;
  }
  .ring-time {
    position: absolute; font-size: 34px; font-weight: 900; color: var(--text);
    letter-spacing: -1px;
  }
  .ring-controls {
    display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;
  }

  /* KPI & FORMS */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 14px;
  }
  .kpi-num { font-size: 18px; font-weight: 900; color: var(--lime); }
  .kpi-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

  .habit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .habit-btn {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px; text-align: left; cursor: pointer;
    font-size: 12px; font-weight: 700; color: #cbd5e1;
    display: flex; align-items: center; gap: 8px;
  }
  .habit-btn.done {
    background: rgba(16, 185, 129, 0.16); border-color: var(--emerald); color: #6ee7b7;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .f-label { font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 5px; display: block; }
  .f-input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 11px 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    padding: 8px 12px; border-radius: 11px; font-size: 12px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
  }
  .chip.active {
    background: rgba(163, 230, 53, 0.16); border-color: var(--lime); color: var(--lime);
  }

  /* MODAL SHEET */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(5, 6, 10, 0.84); backdrop-filter: blur(12px);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-sheet {
    width: 100%; max-width: 560px; background: var(--surface);
    border-top: 1px solid var(--border); border-radius: 26px 26px 0 0;
    padding: 18px 18px calc(24px + env(safe-area-inset-bottom)) 18px;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
  }
  .modal-grab {
    width: 40px; height: 4px; background: rgba(255,255,255,0.2);
    border-radius: 99px; margin: 0 auto 14px auto;
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(10, 12, 18, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 8px 6px calc(10px + env(safe-area-inset-bottom)) 6px;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-dim); font-size: 10px; font-weight: 800; cursor: pointer;
    padding: 4px;
  }
  .nav-btn.active { color: var(--lime); }
  .nav-icon { font-size: 18px; }

  .toast {
    position: fixed; top: 76px; left: 16px; right: 16px; z-index: 80;
    background: #131b14; border: 1px solid var(--lime); color: #f7fee7;
    padding: 12px 14px; border-radius: 14px; font-size: 13px; font-weight: 600;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7); display: none;
  }

  /* BIOMECHANICS KEYFRAMES */
  @keyframes pushMotion {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(15px); }
  }
  @keyframes pullMotion {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-16px); }
  }
  @keyframes rowMotion {
    0%, 100% { transform: translate(0px, 0px); }
    50% { transform: translate(-14px, -12px); }
  }
  @keyframes squatMotion {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(18px); }
  }
  @keyframes thrustMotion {
    0%, 100% { transform: translateY(12px); }
    50% { transform: translateY(-6px); }
  }
  @keyframes calfMotion {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }
  .anim-push { animation: pushMotion 2.4s infinite ease-in-out; }
  .anim-pull { animation: pullMotion 2.4s infinite ease-in-out; }
  .anim-row { animation: rowMotion 2.2s infinite ease-in-out; }
  .anim-squat { animation: squatMotion 2.6s infinite ease-in-out; }
  .anim-thrust { animation: thrustMotion 2.3s infinite ease-in-out; }
  .anim-calf { animation: calfMotion 1.9s infinite ease-in-out; }
  .muscle-glow { animation: glowPulse 1.8s infinite ease-in-out; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="logo-box">TT</div>
      <div style="min-width:0;">
        <div class="brand-title">ТВОЙ ТРЕНЕР</div>
        <div class="brand-sub" id="hdr-sub">Загрузка профиля...</div>
      </div>
    </div>
    <div class="timer-chip" onclick="startRestTimer(90)" id="timer-display">
      ⏱ <span>90 сек</span>
    </div>
  </div>
  <div class="progress-wrap" id="prog-bar-wrap" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="progress-txt" id="prog-txt">0 / 0</div>
  </div>
</header>

<div id="toast" class="toast"></div>

<div id="detail-modal" class="modal-backdrop" onclick="closeModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-grab"></div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="container">
  <div id="tab-workout" class="tab-view">
    <div class="loader-box"><div class="spinner"></div>Загружаем твою тренировку...</div>
  </div>
  <div id="tab-timers" class="tab-view" style="display:none;"></div>
  <div id="tab-progress" class="tab-view" style="display:none;"></div>
  <div id="tab-profile" class="tab-view" style="display:none;"></div>
</div>

<nav class="bottom-nav">
  <div class="nav-btn active" onclick="switchTab('workout', this)">
    <span class="nav-icon">🏋️</span><span>Тренировка</span>
  </div>
  <div class="nav-btn" onclick="switchTab('timers', this)">
    <span class="nav-icon">⏱</span><span>Таймер</span>
  </div>
  <div class="nav-btn" onclick="switchTab('progress', this)">
    <span class="nav-icon">📈</span><span>Прогресс</span>
  </div>
  <div class="nav-btn" onclick="switchTab('profile', this)">
    <span class="nav-icon">⚙️</span><span>Анкета</span>
  </div>
</nav>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const urlParams = new URLSearchParams(window.location.search);
const USER_ID = urlParams.get('uid') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '5028559439');

let APP_STATE = null;
let timerInterval = null;
let timerRemaining = 0;
let timerTotal = 90;
let autoTimerEnabled = true;
let warmupOpen = false;

const PURE_BODYWEIGHT_IDS = new Set([
  "chest_pushups", "chest_decline_pushups",
  "back_australian_pullups", "back_floor_swimmers",
  "sh_pike_pushups",
  "tri_bench_dips", "tri_diamond_pushups",
  "quads_bw_squat", "quads_wall_sit",
  "ham_single_leg_bridge", "ham_slider_curls",
  "glutes_bridge_floor",
  "calves_bw_step",
  "abs_hanging_leg_raise", "abs_floor_crunches", "abs_rkc_plank", "abs_slow_bicycle", "abs_dip_bar_knee_raise"
]);

function isBodyweightExercise(ex) {
  if (!APP_STATE || !APP_STATE.profile) return PURE_BODYWEIGHT_IDS.has(ex.id);
  if (APP_STATE.profile.equipment === 'bodyweight') return true;
  return PURE_BODYWEIGHT_IDS.has(ex.id);
}

function haptic(type='light') {
  if (!tg || !tg.HapticFeedback) return;
  if (type === 'selection') tg.HapticFeedback.selectionChanged();
  else if (type === 'success' || type === 'warning') tg.HapticFeedback.notificationOccurred(type);
  else tg.HapticFeedback.impactOccurred(type);
}

function playBeep() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    [880, 1100].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.16);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.16 + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.16);
      osc.stop(ctx.currentTime + idx * 0.16 + 0.15);
    });
  } catch (e) {}
}

function showToast(htmlMsg, duration=3800) {
  const el = document.getElementById('toast');
  el.innerHTML = htmlMsg;
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, duration);
}

function startRestTimer(seconds) {
  haptic('light');
  clearInterval(timerInterval);
  timerTotal = Math.max(10, seconds);
  timerRemaining = timerTotal;
  const pill = document.getElementById('timer-display');
  pill.classList.add('running');
  updateTimerUI();
  showToast(`⏱ Отдых <b>${timerTotal} сек</b> пошёл.`);
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerUI();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      pill.classList.remove('running');
      pill.innerHTML = `⏱ <span>90 сек</span>`;
      haptic('warning');
      playBeep();
      showToast(`🚨 <b>ОТДЫХ ЗАКОНЧЕН!</b> К снаряду, следующий подход!`, 5500);
    }
  }, 1000);
}

function adjustTimer(delta) {
  if (timerRemaining <= 0) {
    startRestTimer(Math.max(15, 60 + delta));
    return;
  }
  timerRemaining = Math.max(5, timerRemaining + delta);
  timerTotal = Math.max(timerTotal, timerRemaining);
  haptic('selection');
  updateTimerUI();
}

function stopTimer() {
  clearInterval(timerInterval);
  timerRemaining = 0;
  const pill = document.getElementById('timer-display');
  pill.classList.remove('running');
  pill.innerHTML = `⏱ <span>90 сек</span>`;
  updateTimerUI();
}

function updateTimerUI() {
  const pill = document.getElementById('timer-display');
  const m = Math.floor(Math.max(0, timerRemaining) / 60);
  const s = Math.max(0, timerRemaining) % 60;
  const fmt = `${m}:${s < 10 ? '0'+s : s}`;

  if (timerRemaining > 0) {
    pill.innerHTML = `🔥 <span>${fmt}</span>`;
  }

  const ringTxt = document.getElementById('ring-time-txt');
  const ringCircle = document.getElementById('ring-progress');
  if (ringTxt) ringTxt.innerText = timerRemaining > 0 ? fmt : '0:00';
  if (ringCircle) {
    const circumference = 2 * Math.PI * 62;
    const ratio = timerRemaining > 0 ? (timerRemaining / timerTotal) : 0;
    ringCircle.style.strokeDashoffset = circumference * (1 - ratio);
  }
}

    ? `<div style="background:var(--surface-2);border:1px solid var(--border);padding:11px 13px;border-radius:12px;font-size:12px;margin-bottom:14px;">

function renderPlatesBreakdown(totalWeight) {
  if (!totalWeight || totalWeight <= 20) {
    return `<div style="background:var(--surface-2);padding:10px 12px;border-radius:12px;font-size:12px;color:var(--text-dim);margin-bottom:14px;">
      🏋️ <b>Калькулятор блинов:</b> пустой олимпийский гриф (20 кг) или гантели.
    </div>`;
  }
  let perSide = (totalWeight - 20) / 2;
  const avail = [25, 20, 15, 10, 5, 2.5, 1.25];
  const plates = [];
  for (const p of avail) {
    while (perSide >= p - 0.01) {
      plates.push(p);
      perSide -= p;
    }
  }
  const str = plates.length ? plates.map(p => `${p} кг`).join(' + ') : 'только гриф';
  return `<div style="background:var(--surface-2);border:1px solid var(--border);padding:11px 13px;border-radius:12px;font-size:12px;margin-bottom:14px;">

function closeModal(ev) {
  if (!ev || ev.target.id === 'detail-modal') {

async function fetchState(mode='') {
  try {
    const res = await fetch(`/api/state?uid=${USER_ID}${mode ? '&mode='+mode : ''}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    APP_STATE = await res.json();
    renderAll();
  } catch (e) {
    document.getElementById('tab-workout').innerHTML = `
      <div class="hero-card" style="text-align:center;">
        <div class="hero-title">⚠️ Нет связи с сервером</div>
        <div class="hero-sub" style="margin-bottom:14px;">Проверь интернет и нажми кнопку ниже.</div>
        <button class="btn btn-lime btn-full" onclick="fetchState()">🔄 Повторить</button>
      </div>`;

function switchTab(tab, navEl) {
  haptic('selection');
  document.querySelectorAll('.tab-view').forEach(el => el.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (navEl) {
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    navEl.classList.add('active');
  }
}

function renderAll() {
  if (!APP_STATE) return;
  if (!APP_STATE.has_profile) {
    renderProfileTab(true);
    switchTab('profile', document.querySelectorAll('.nav-btn')[3]);
    return;
  }
  document.getElementById('hdr-sub').innerText = `${APP_STATE.profile_summary.split_name} • ${APP_STATE.nutrition.kcal} ккал`;
  renderWorkoutTab();
  renderTimersTab();
  renderProgressTab();
  renderProfileTab(false);
}

function adjustWeight(idx, delta) {
  const inp = document.getElementById(`w-${idx}`);
  const cur = parseFloat(inp.value || '0');
  const next = Math.max(0, Math.round((cur + delta) * 2) / 2);
  inp.value = next;
  haptic('selection');
}

function adjustAllSets(idx, delta) {
  const inputs = document.querySelectorAll(`.set-inp-${idx}`);
  inputs.forEach(inp => {
    const cur = parseInt(inp.value || '1', 10);
    inp.value = Math.max(1, cur + delta);
  });
  haptic('selection');
}

function calculateLiveTonnage(exercises) {
  let total = 0;
  exercises.forEach(ex => {
    if (ex.logged_today && ex.logged_weight > 0 && Array.isArray(ex.logged_reps)) {
      const sumReps = ex.logged_reps.reduce((a, b) => a + b, 0);
      total += ex.logged_weight * sumReps;
    }
  });
  return Math.round(total);
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function toggleCheckItem(storagePrefix, itemKey) {
  const fullKey = `${storagePrefix}_${getTodayKey()}_${itemKey}`;
  const cur = localStorage.getItem(fullKey) === '1';
  localStorage.setItem(fullKey, cur ? '0' : '1');
  haptic('selection');
  renderWorkoutTab();
  renderProgressTab();
}

function isItemChecked(storagePrefix, itemKey) {
  return localStorage.getItem(`${storagePrefix}_${getTodayKey()}_${itemKey}`) === '1';
}

async function submitExercise(idx, isBW, restSec) {
  const wInp = document.getElementById(`w-${idx}`);
  const wVal = (!isBW && wInp) ? parseFloat(wInp.value || '0') : 0;
  const repInputs = document.querySelectorAll(`.set-inp-${idx}`);
  const reps = Array.from(repInputs).map(el => parseInt(el.value, 10)).filter(n => !isNaN(n) && n > 0);

  if (!reps.length) {
    showToast('⚠️ Укажи количество повторений хотя бы в одном подходе!');
    return;
  }

  const res = await fetch('/api/log_exercise', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ uid: USER_ID, idx, weight: wVal, reps })
  });
  const data = await res.json();
  if (data.ok) {
    haptic('medium');
    if (autoTimerEnabled && restSec) {
      startRestTimer(restSec);
    }
    showToast(data.message, 4500);
    fetchState();
  }
}

async function swapExercise(idx) {
  haptic('light');
  const res = await fetch('/api/swap', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ uid: USER_ID, idx })

  showToast(data.message);

    `<div class="chip ${p.training_days.includes(parseInt(k)) ? 'active' : ''}" onclick="toggleArrayItem('training_days', ${parseInt(k)}, 7, this)">${lbl}</div>`
  ).join('');

  const injChips = Object.entries(APP_STATE.injury_names).map(([k, lbl]) =>
    `<div class="chip ${p.injuries.includes(k) ? 'active' : ''}" onclick="toggleArrayItem('injuries', '${k}', 4, this)">${lbl}</div>`
  ).join('');

  container.innerHTML = `
    <div class="hero-card">
      <div class="hero-tag">${isFirstRun ? '🔥 Шаг 1: Настройка' : '⚙️ Профиль атлета'}</div>
      <div class="hero-title">${isFirstRun ? 'Первичная анкета' : 'Параметры и цели'}</div>
      <div class="hero-sub" style="margin-bottom:14px;">Алгоритм пересчитает сплит, норму белка/калорий и нагрузку.</div>

      <div class="form-row">
        <div>
          <label class="f-label">Пол</label>
          <select id="pf-gender" class="f-input">
            <option value="Мужской" ${p.gender==='Мужской'?'selected':''}>Мужской</option>
            <option value="Женский" ${p.gender==='Женский'?'selected':''}>Женский</option>
          </select>
        </div>
        <div>
          <label class="f-label">Возраст (лет)</label>
          <input type="number" id="pf-age" class="f-input" value="${p.age}">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label class="f-label">Рост (см)</label>
          <input type="number" id="pf-height" class="f-input" value="${p.height}">
        </div>
        <div>
          <label class="f-label">Вес (кг)</label>
          <input type="number" step="0.1" id="pf-weight" class="f-input" value="${p.weight}">
        </div>
      </div>

      <label class="f-label">Главная цель</label>
      <select id="pf-goal" class="f-input" style="margin-bottom:12px;">
        <option value="mass" ${p.goal==='mass'?'selected':''}>💪 Набор мышечной массы</option>
        <option value="cut" ${p.goal==='cut'?'selected':''}>🔥 Рельеф и жиросжигание</option>
        <option value="strength" ${p.goal==='strength'?'selected':''}>🏋️ Максимальная сила</option>
      </select>

      <label class="f-label">Приоритетные мышцы (1–3 группы, идут первыми)</label>
      <div class="chips">${muscleChips}</div>

      <div class="form-row">
        <div>
          <label class="f-label">Уровень</label>
          <select id="pf-level" class="f-input">
            <option value="beginner" ${p.level==='beginner'?'selected':''}>Новичок</option>
            <option value="intermediate" ${p.level==='intermediate'?'selected':''}>Средний</option>
            <option value="advanced" ${p.level==='advanced'?'selected':''}>Продвинутый</option>
          </select>
        </div>
        <div>
          <label class="f-label">Где тренируешься</label>
          <select id="pf-equip" class="f-input">
            <option value="gym" ${p.equipment==='gym'?'selected':''}>Тренажерный зал</option>
            <option value="street" ${p.equipment==='street'?'selected':''}>Турники и брусья</option>
            <option value="dumbbells" ${p.equipment==='dumbbells'?'selected':''}>Гантели дома</option>
            <option value="bodyweight" ${p.equipment==='bodyweight'?'selected':''}>Только свой вес</option>
          </select>
        </div>
      </div>

      <label class="f-label">Дни тренировок (напоминания в 09:00 и 20:00)</label>
      <div class="chips">${dayChips}</div>

      <div class="form-row">
        <div>
          <label class="f-label">Длительность</label>
          <select id="pf-dur" class="f-input">
            <option value="30" ${p.duration==30?'selected':''}>30 мин</option>
            <option value="45" ${p.duration==45?'selected':''}>45 мин</option>
            <option value="60" ${p.duration==60?'selected':''}>60 мин</option>
            <option value="90" ${p.duration==90?'selected':''}>90 мин</option>
          </select>
        </div>
        <div>
          <label class="f-label">Часовой пояс</label>
          <select id="pf-tz" class="f-input">
            <option value="Europe/Kaliningrad" ${p.timezone==='Europe/Kaliningrad'?'selected':''}>МСК-1</option>
            <option value="Europe/Moscow" ${p.timezone==='Europe/Moscow'?'selected':''}>МСК</option>
            <option value="Europe/Samara" ${p.timezone==='Europe/Samara'?'selected':''}>МСК+1</option>
            <option value="Asia/Yekaterinburg" ${p.timezone==='Asia/Yekaterinburg'?'selected':''}>МСК+2</option>
            <option value="Asia/Omsk" ${p.timezone==='Asia/Omsk'?'selected':''}>МСК+3</option>
            <option value="Asia/Krasnoyarsk" ${p.timezone==='Asia/Krasnoyarsk'?'selected':''}>МСК+4</option>
            <option value="Asia/Irkutsk" ${p.timezone==='Asia/Irkutsk'?'selected':''}>МСК+5</option>
            <option value="Asia/Vladivostok" ${p.timezone==='Asia/Vladivostok'?'selected':''}>МСК+7</option>
          </select>
        </div>
      </div>

      <label class="f-label">Травмы / ограничения</label>
      <div class="chips">${injChips}</div>

      <button class="btn btn-lime btn-full" onclick="saveProfileForm()">
        ✅ Сохранить и обновить программу
      </button>
    </div>
  `;
}

function toggleArrayItem(field, val, maxLen, el) {
  haptic('selection');
  const arr = window._formState[field];
  const idx = arr.indexOf(val);
  if (idx >= 0) {
    arr.splice(idx, 1);
    el.classList.remove('active');
  } else {
    if (arr.length >= maxLen) {
      showToast(`⚠️ Можно выбрать максимум ${maxLen}!`);
      return;
    }
    arr.push(val);
    el.classList.add('active');
  }
}

async function saveProfileForm() {
  const st = window._formState;
  if (!st.priority_muscles.length) { showToast('⚠️ Выбери хотя бы 1 приоритетную мышцу!'); return; }
  if (!st.training_days.length) { showToast('⚠️ Выбери хотя бы 1 день тренировок!'); return; }

  const payload = {
    uid: USER_ID,
    gender: document.getElementById('pf-gender').value,
    age: parseInt(document.getElementById('pf-age').value || '22'),
    height: parseInt(document.getElementById('pf-height').value || '178'),
    weight: parseFloat(document.getElementById('pf-weight').value || '75'),
    goal: document.getElementById('pf-goal').value,
    priority_muscles: st.priority_muscles,
    level: document.getElementById('pf-level').value,
    equipment: document.getElementById('pf-equip').value,
    training_days: st.training_days,
    duration: parseInt(document.getElementById('pf-dur').value || '60'),
    injuries: st.injuries,
    timezone: document.getElementById('pf-tz').value
  };

  const res = await fetch('/api/save_profile', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.ok) {
    showToast('✅ Профиль обновлен! Новая программа готова.');
    haptic('success');
    await fetchState();
    switchTab('workout', document.querySelectorAll('.nav-btn')[0]);
  }
}

fetchState();
</script>
</body>
</html>
